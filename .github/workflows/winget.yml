name: Publish to Winget
on:
  release:
    types: [released]

# each job asks for more when it needs it
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: dundee.gdu
          installers-regex: '_windows_[\w.]+\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
