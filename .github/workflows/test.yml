on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

name: run tests
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27.x
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Run linters
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0

  test:
    strategy:
      matrix:
        go-version: [1.26.x, 1.27.x]
        platform: [ubuntu-latest]
        include:
          - go-version: 1.27.x
            platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Install Go
      if: success()
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Run tests
      run: go test -v -covermode=count ./...
      env:
        # lets the darwin-only test move a file into the runner's real Trash
        GDU_TEST_SYSTEM_TRASH: "1"

  cross-compile:
    runs-on: ubuntu-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27.x
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Build for every released platform
      # releases are built for these systems (Makefile, build-all); gox
      # skips a target that does not build, so check here that all build
      run: |
        failed=0
        for target in $(go tool dist list | grep -E '^(darwin|freebsd|linux|netbsd|openbsd|windows)/') android/arm64; do
          if ! GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/gdu; then
            echo "::error::gdu does not build for $target"
            failed=1
          fi
        done
        exit $failed

  coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Install Go
      if: success()
      uses: actions/setup-go@v7
      with:
        go-version: 1.27.x
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Calc coverage
      run: |
        go test -v -race -covermode=atomic -coverprofile=coverage.out ./...
    - name: Upload coverage report
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.out
        fail_ci_if_error: true
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}
