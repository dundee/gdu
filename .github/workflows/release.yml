name: Release
on:
  push:
    tags:
      - 'v*'

# each job asks for more when it needs it
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # the draft release and its assets
      contents: write
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run tests
        run: go test -v -covermode=count ./...
      - name: Install tooling
        run: go install github.com/mitchellh/gox@v1.0.1
      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "use-agent" >> ~/.gnupg/gpg.conf
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PRIVATE_GPG_KEY }}
      - name: Build
        run: |
          make clean
          make tarball
          make build-all
          make man
          make clean-uncompressed-dist
          cd dist
          sha256sum * > sha256sums.txt
          gpg --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --sign --armor --detach-sign sha256sums.txt
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          files: |
            dist/*
          generate_release_notes: true