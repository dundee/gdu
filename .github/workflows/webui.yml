on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: web UI
# each job asks for more when it needs it
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x

      - name: Install frontend dependencies
        working-directory: internal/webui/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: internal/webui/frontend
        run: npm test

      - name: Build frontend
        working-directory: internal/webui/frontend
        run: npm run build

      - name: Verify committed bundle is up to date
        run: |
          if ! git diff --exit-code -- internal/webui/dist; then
            echo "::error::internal/webui/dist is out of date. Run 'make build-web' and commit the result."
            exit 1
          fi

      - name: Verify Go build embeds the UI
        run: go build ./...
